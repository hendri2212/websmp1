# Example only: set domain, project root, PHP-FPM address, and HTTPS for hosting.
server {
    listen 80;
    server_name example.com;
    root /var/www/websmp1;
    index index.php;
    autoindex off;
    server_tokens off;
    client_max_body_size 25m;

    # Only the front controller is executed by PHP-FPM.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Keep this retired URL compatible; the controller returns HTTP 410.
    location = /pages/ppdb_receipt.php {
        rewrite ^ /index.php last;
    }

    location ~ (^|/)\. {
        return 403;
    }

    location ~* ^/(app|config|database|storage|tests|includes|templates|pages)(/|$) {
        return 403;
    }

    location ~* (^|/)(backup|backups|dumps|logs|source_docs)(/|$) {
        return 403;
    }

    location ~* \.(sql|md|env|ini|log|bak|backup|conf|cnf|pem|key|p12|pfx|jks|ps1|sh|zip|gz|bz2|xz|7z|rar|tar|json)([.~].*)?$ {
        return 403;
    }

    location = /preview_router.php {
        return 403;
    }

    location ~* ^/public/uploads/.*\.(jpg|jpeg|png|webp|mp4|mov)$ {
        try_files $uri =404;
    }

    location ~* ^/public/uploads/ {
        return 403;
    }

    location ~* ^/public/.*\.(php[0-9]*|phtml|pht|phar|cgi|pl|asp|aspx|jsp)(/|$) {
        return 403;
    }

    # Existing /admin/*.php URLs route to MVC controllers, never arbitrary scripts.
    location ~ \.php(/|$) {
        rewrite ^ /index.php last;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }
}
